name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy
      - name: Prepare report directory
        run: mkdir -p artifacts
      - name: Check Rust workspace
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo fmt --all --check 2>&1 | tee artifacts/cargo-fmt.log || status=1
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 \
            | tee artifacts/cargo-clippy.log || status=1
          cargo test --workspace --all-targets 2>&1 \
            | tee artifacts/cargo-test.log || status=1
          exit "$status"
      - name: Upload Rust report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-ci-report
          path: artifacts/
          if-no-files-found: error
