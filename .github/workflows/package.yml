name: Package and release-candidate gate

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: "Request draft RC eligibility after all evidence is present"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-load:
    name: package-and-load (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            blender: true
          - platform: windows-x86_64
            os: windows-latest
            blender: false
          - platform: macos-arm64
            os: macos-14
            blender: false
          - platform: macos-x86_64
            os: macos-15-intel
            blender: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install maturin
        run: python -m pip install maturin==1.14.1
      - name: Add dumpbin to PATH on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find **/dumpbin.exe | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found" }
          Split-Path $dumpbin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare report directory
        run: python -c "from pathlib import Path; Path('artifacts/${{ matrix.platform }}').mkdir(parents=True, exist_ok=True)"
      - name: Install pinned Blender 5.2 on Linux
        if: matrix.blender
        run: >-
          python scripts/ci/install_blender.py
          --destination blender-runtime
          --report artifacts/${{ matrix.platform }}/blender-install.json
      - name: Run package and load harness
        shell: bash
        run: |
          blender_args=()
          if [[ "${{ matrix.blender }}" == "true" ]]; then
            blender_args+=(--blender "$(find blender-runtime -type f -name blender -print -quit)")
          fi
          python scripts/ci/run_package_load.py \
            --platform "${{ matrix.platform }}" \
            --report-dir "artifacts/${{ matrix.platform }}" \
            --commit "${GITHUB_SHA}" \
            $([[ "${{ matrix.blender }}" == "true" ]] && echo "--reference-output artifacts/${{ matrix.platform }}/reference.json") \
            "${blender_args[@]}"
      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}/
          if-no-files-found: error

  contract:
    needs: package-and-load
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download platform evidence
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts/platforms
          merge-multiple: false
      - name: Validate evidence manifest
        env:
          CREATE_DRAFT: ${{ inputs.create_draft }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = {
              "linux-x86_64",
              "windows-x86_64",
              "macos-arm64",
              "macos-x86_64",
          }
          found = set()
          failures = []
          for directory in Path("artifacts/platforms").glob("package-*"):
              report = directory / "package-load-report.json"
              if not report.is_file():
                  failures.append(f"missing report: {report}")
                  continue
              data = json.loads(report.read_text())
              found.add(data.get("platform"))
              if data.get("status") != "ok":
                  failures.append(f"failed platform: {data.get('platform')}")
          if found != expected:
              failures.append(f"platform set mismatch: {sorted(found)}")
          result = {"commit": os.environ["GITHUB_SHA"], "platforms": sorted(found), "failures": failures}
          Path("artifacts").mkdir(exist_ok=True)
          Path("artifacts/platform-evidence.json").write_text(json.dumps(result, indent=2) + "\n")
          if failures:
              raise SystemExit("; ".join(failures))
          PY
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-contract
          path: artifacts/platform-evidence.json
          if-no-files-found: error

      - name: Run V1 core and documentation criteria
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/v1-gate
          status=0
          cargo fmt --all --check > artifacts/v1-gate/cargo-fmt.log 2>&1; fmt_status=$?; status=$((status || fmt_status))
          cargo clippy --workspace --all-targets -- -D warnings > artifacts/v1-gate/cargo-clippy.log 2>&1; clippy_status=$?; status=$((status || clippy_status))
          cargo test --workspace --all-targets > artifacts/v1-gate/cargo-test.log 2>&1; test_status=$?; status=$((status || test_status))
          python scripts/ci/run_python_tests.py --exclude-prefix test_native_ --report-dir artifacts/v1-gate/python > artifacts/v1-gate/python-test.log 2>&1; python_status=$?; status=$((status || python_status))
          FMT_STATUS="$fmt_status" CLIPPY_STATUS="$clippy_status" TEST_STATUS="$test_status" PYTHON_STATUS="$python_status" python - <<'PY'
          import os
          import json
          from pathlib import Path
          reports = {
              "rust_tests": os.environ["TEST_STATUS"] == "0",
              "workspace_clippy": os.environ["CLIPPY_STATUS"] == "0",
              "blender_headless": json.loads(Path("artifacts/platforms/package-linux-x86_64/package-load-report.json").read_text()).get("blender", {}).get("status") == "ok",
              "documentation": os.environ["PYTHON_STATUS"] == "0" and all(Path(path).is_file() for path in ("README.md", "CHANGELOG.md", "docs/limitations.md", "docs/building.md", "docs/testing.md")),
          }
          Path("artifacts/v1-gate/ci-report.json").write_text(json.dumps(reports, indent=2) + "\n")
          PY
          exit "$status"

      - name: Build V1 acceptance artifact
        if: always()
        shell: bash
        run: |
          draft_flag=()
          if [[ "${{ inputs.create_draft }}" == "true" ]]; then draft_flag=(--create-draft); fi
          python scripts/ci/build_v1_acceptance.py \
            --commit "${GITHUB_SHA}" \
            --github-sha "${GITHUB_SHA}" \
            --reference artifacts/platforms/package-linux-x86_64/reference.json \
            --ci-report artifacts/v1-gate/ci-report.json \
            --report "linux-x86_64=artifacts/platforms/package-linux-x86_64/package-load-report.json" \
            --report "windows-x86_64=artifacts/platforms/package-windows-x86_64/package-load-report.json" \
            --report "macos-arm64=artifacts/platforms/package-macos-arm64/package-load-report.json" \
            --report "macos-x86_64=artifacts/platforms/package-macos-x86_64/package-load-report.json" \
            --output artifacts/v1-gate/v1-acceptance.json \
            --failure-snapshot artifacts/v1-gate/failure-snapshot.json \
            "${draft_flag[@]}"

      - name: Upload V1 acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-acceptance
          path: artifacts/v1-gate/
          if-no-files-found: error
